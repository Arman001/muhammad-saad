services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: chatapp
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d chatapp']
      interval: 5s
      retries: 10

  # Applies database migrations once, then exits.
  migrate:
    build: .
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/chatapp
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    env_file: .env
    environment:
      # Overrides for running inside Docker.
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app@db:5432/chatapp
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
